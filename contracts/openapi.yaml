      required: [timeZone, revision, changes]
      properties:
        timeZone: { type: string, maxLength: 100 }
        revision: { type: integer, minimum: 1 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/DailyGoalTarget' }
    DailyGoalChange:
      type: object
      additionalProperties: false
      required: [accountId, operationId, expectedRevision, timeZone, from, minutes]
      properties:
        accountId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 0 }
        timeZone: { type: string, maxLength: 100 }
        from: { type: string, format: date }
        minutes: { type: integer, enum: [5, 10, 20, 30, 60] }
        initialChanges:
          description: Initial history, or explicitly imported history strictly before the first saved account target. Existing account days cannot be replaced.
          type: array
          maxItems: 3660
          items: { $ref: '#/components/schemas/DailyGoalTarget' }
    AccountDailyGoal:
      type: object
      required: [accountId, goal, progress]
