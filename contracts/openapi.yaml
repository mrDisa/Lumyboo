          properties:
            day: { type: string, format: date }
            minutes: { type: integer, enum: [5, 10, 20, 30, 60] }
            milliseconds: { type: integer, minimum: 0 }
            complete: { type: boolean }
            streak: { type: integer, minimum: 0, description: Consecutive completed days through this day or yesterday if this day is unfinished. }

    CoverageRange:
      type: array
      description: Exactly [from, to], with from less than to, in integer millionths of a paragraph.
      minItems: 2
      maxItems: 2
      items: { type: integer, minimum: 0, maximum: 1000000 }
    ReadingCoverage:
