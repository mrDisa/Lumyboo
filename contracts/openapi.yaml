openapi: 3.0.3
info:
  title: Lumyboo API
  version: 0.1.0
  description: Local pilot. Authentication, synchronization and rewards are not implemented.
servers:
  - url: /api/v1
paths:
  /catalog:
    get:
      operationId: listBooks
      description: Development fixtures only; not an approved public editorial catalog.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: genre
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Book list
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Book' } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Request error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Book:
      type: object
      required: [id, title, author, genre, year, kind, version, url, sha256, bytes, rights, description, cover]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        genre: { type: string }
        year: { type: string }
        kind: { type: string, enum: [fixture, excerpt] }
        version: { type: string }
        url: { type: string }
        sha256: { type: string }
        bytes: { type: integer }
        rights: { type: string }
        description: { type: string }
        cover: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
