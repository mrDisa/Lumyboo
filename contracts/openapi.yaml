openapi: 3.0.3
info:
  title: Lumyboo API
  version: 0.1.0
  description: Local pilot with email-code authentication and server sessions. Synchronization and rewards are not implemented.
servers:
  - url: /api/v1
paths:
  /challenges:
    get:
      operationId: listOwnChallenges
      description: Private membership list including left memberships. Expected account prevents cookie-switch disclosure.
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Challenges joined or created by the signed-in account.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, items]
                properties:
                  accountId: { type: string, format: uuid }
                  items: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createChallenge
      description: Create private conditions and owner membership atomically. Targets are immutable. Identical operation retries return the original challenge even after start; changed payloads conflict. New challenges start after today in their selected zone.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChallenge' }
      responses:
        '200':
          description: Saved challenge, including immutable retries.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, challenge]
                properties:
                  accountId: { type: string, format: uuid }
                  challenge: { $ref: '#/components/schemas/Challenge' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /challenges/action:
    post:
      operationId: challengeAction
      description: Authenticated code preview, joining before start (maximum 10 active members), owner invitation creation/revocation and terminal leave. Join retries preserve the original target and nickname, including after leave. Leaving preserves membership history; owner leave revokes invitations. Nonmembers see conditions only, never the roster. No age restriction. Codes are bearer secrets and should be shared privately.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeAction' }
      responses:
        '200':
          description: Current conditions or membership and invitation code for the owner when requested.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, challenge, code]
                properties:
                  accountId: { type: string, format: uuid }
                  challenge: { $ref: '#/components/schemas/Challenge' }
                  code: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /daily-goal:
    get:
      operationId: getDailyGoal
      description: Account targets and accepted client reading time. Confirmation acknowledges storage, not independent evidence of reading or rewards.
      parameters:
        - name: day
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Historical target and accepted total; defaults to today in the account time zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDailyGoal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: chooseDailyGoal
      description: Initialize settings or replace tomorrow's goal. The account time zone stays fixed. Operation IDs permit safe retries, revisions reject concurrent edits. Initial local history can be copied only on first setup.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyGoalChange' }
      responses:
        '200':
          description: Current account settings, including on a retry.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, goal]
                properties:
                  accountId: { type: string, format: uuid }
                  goal: { $ref: '#/components/schemas/DailyGoalSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /catalog:
    get:
      operationId: listBooks
      description: Development fixtures only; not an approved public editorial catalog.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: genre
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Book list
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Book' } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
  /auth/code:
    post:
      operationId: requestLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Code accepted for delivery; no account-existence information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/verify:
    post:
      operationId: verifyLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              additionalProperties: false
              properties:
                challengeId: { type: string, minLength: 43, maxLength: 43 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: A new HttpOnly session cookie is set; raw session tokens are never in JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getAccountSession
      responses:
        '200':
          description: Current account only. Always Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Current session revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/logout-all:
    post:
      operationId: logoutAll
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: All sessions of the current user revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /shelf/:
    get:
      operationId: getAccountShelf
      description: Current account only; never cached. Guest reading data stays separate.
      responses:
        '200':
          description: Account shelf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountShelf' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /shelf/import:
    post:
      operationId: importGuestShelf
      description: Explicit additive copy. Existing account books are preserved; retries cannot create duplicates. Does not consume the guest outbox or transfer progress/bookmarks.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, bookIds]
              additionalProperties: false
              properties:
                accountId: { type: string, format: uuid, description: Expected account; must match the authenticated session. }
                bookIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '200':
          description: Merged account shelf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountShelf' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /bookmarks/:
    get:
      operationId: getAccountBookmarks
      description: Current account only; no guest data or shared caching.
      responses:
        '200':
          description: Active account bookmarks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBookmarks' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /bookmarks/import:
    post:
      operationId: importGuestBookmarks
      description: Additive explicit copy. Existing locators, labels and deletion tombstones win. Entire batch is validated and committed atomically.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, bookmarks]
              properties:
                accountId: { type: string, format: uuid }
                bookmarks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/BookmarkEntry' }
      responses:
        '200':
          description: Active account bookmarks after merge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBookmarks' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /bookmarks/state:
    get:
      operationId: getAccountBookmarkState
      description: Full account bookmark snapshot including deletion tombstones and per-bookmark revisions. Never cached.
      responses:
        '200':
          description: Current account bookmark state
          content:
            application/json:
              schema:
                type: object
                required: [accountId, bookmarks]
                properties:
                  accountId: { type: string, format: uuid }
                  bookmarks: { type: array, items: { $ref: '#/components/schemas/BookmarkState' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /bookmarks/apply:
    post:
      operationId: applyAccountBookmark
      description: One atomic bookmark mutation with optimistic revision and durable operation receipt. Revision 0 means absent; deletes create tombstones even when absent. Reusing an operation UUID with different payload or operation kind fails. A replay returns its original result, which may be older than current state. Client clocks never set precedence. Only current pilot editions are accepted.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, operationId, expectedRevision, bookmark, deleted]
              properties:
                accountId: { type: string, format: uuid }
                operationId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740990 }
                bookmark: { $ref: '#/components/schemas/BookmarkEntry' }
                deleted: { type: boolean }
      responses:
        '200':
          description: Original committed operation result; refetch state for current data
          content:
            application/json:
              schema:
                type: object
                required: [accountId, bookmark]
                properties:
                  accountId: { type: string, format: uuid }
                  bookmark: { $ref: '#/components/schemas/BookmarkState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /positions/:
    get:
      operationId: getAccountPositions
      responses:
        '200':
          description: Current account reading positions; never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPositions' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /positions/choose:
    post:
      operationId: chooseAccountPosition
      description: Explicit choice against the displayed server revision (0 means absent). Prior server position is archived. Retry exactly the same operation ID and payload after an uncertain response; a stale revision is a conflict, not last-write-wins.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PositionChoice'
                - type: object
                  required: [accountId]
                  properties:
                    accountId: { type: string, format: uuid }
      responses:
        '200':
          description: Confirmed position (an idempotent replay may acknowledge an earlier revision).
          content:
            application/json:
              schema:
                type: object
                required: [accountId, position]
                properties:
                  accountId: { type: string, format: uuid }
                  position: { $ref: '#/components/schemas/AccountPosition' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /reading-sessions/:
    get:
      operationId: listReadingSessions
      description: Live pages of the signed-in owner's cumulative reports from all devices, ordered by reported day descending then session UUID descending. Always no-store. Does not import local time or verify days or rewards. Concurrent new rows ahead of the cursor require a refresh; duration updates never change ordering.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page; empty starts at the newest reported day.
          schema: { type: string, maxLength: 47 }
      responses:
        '200':
          description: One page; empty nextCursor means no further rows at query time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSessionPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reading-sessions/{sessionId}:
    get:
      operationId: getReadingSession
      description: Current cumulative client report for the signed-in owner only. A missing or other owner's session returns 404. Always no-store. Does not verify actual reading, calendar-day credit, coverage or rewards.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current session snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reading-sessions/apply:
    post:
      operationId: applyReadingSession
      description: |
        Accept one cumulative, unverified client report. Requires Origin, session cookie,
        X-CSRF-Token and the expected account ID. Session IDs are scoped to the owner.
        A session's device, book, edition and reported calendar day are immutable.
        Milliseconds are a cumulative integer total, never an increment. Larger reports
        advance the total; equal or delayed smaller reports do not change it or its revision.
        Each operation UUID is bound to the complete payload and the shared operation kind.
        Retry an uncertain operation with the same UUID and payload. A retry returns its
        original receipt, which may be older than the current session; never treat it as
        a fresh server snapshot or acknowledgement of later local reports.
        Day is reported by the client, without verified timezone attribution. This endpoint
        grants no daily-goal credit, completion, coverage, XP, streak or race result.
        The browser sends new timer reports explicitly from the account profile,
        in bounded batches with exact persisted operation payloads for retries.
        Old local sessions without edition/device metadata stay local and must not
        be guessed into this protocol.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, operationId, session]
              properties:
                accountId: { type: string, format: uuid }
                operationId: { type: string, format: uuid }
                session: { $ref: '#/components/schemas/ReadingSessionReport' }
      responses:
        '200':
          description: Original operation receipt; not necessarily the current session snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: account_changed, operation_reused or reading_session_conflict. Do not silently retry with changed identity or a new UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /reading-coverage/{bookId}:
    get:
      operationId: listReadingCoverage
      description: |
        Private live pages of geometric text observations for the session owner and
        the exact book edition, including historical editions. No completion is inferred.
        Ordered by paragraph ID using bytewise C collation, not reading order.
        Concurrent range updates do not move rows. New rows before the cursor require
        refreshing from the start. Empty history returns items: []. Responses are no-store.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: version
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Owner-scoped page; nextCursor is empty on the final page.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, items, nextCursor]
                properties:
                  accountId: { type: string, format: uuid }
                  items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ReadingCoverage' } }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reading-coverage/apply:
    post:
      operationId: applyReadingCoverage
      description: |
        Atomically union one paragraph's geometric observations with saved coverage.
        Requires Origin, session cookie, X-CSRF-Token and expected accountId.
        Only paragraphs in the current development edition allowlist are accepted.
        Ranges are integer millionths of paragraph geometry, not character offsets.
        Overlap and adjacency merge; gaps remain gaps. Up to 64 incoming ranges,
        8192 request bytes and 256 stored disjoint ranges per paragraph. Exceeding the
        stored fragment limit returns coverage_fragment_limit without mutation or receipt;
        do not bridge unobserved gaps or silently drop local observations to bypass it.
        Shared operation UUID space with positions, bookmarks and time. Uncertain requests
        must retry the exact UUID and payload. An exact retry returns its original receipt,
        which may predate other observations; it must not replace newer local coverage.
        Geometry is approximate, especially across layout/font changes. No proof of reading,
        completed book, minutes, goal, XP, streak or race result is produced.
        The browser explicitly sends account observations from the profile in bounded
        batches, retaining immutable sending snapshots for retries. Guest observations
        remain local. For a selected verified edition, the browser can explicitly fetch
        all live pages and atomically union them with local coverage after validation.
        Receiving coverage does not acknowledge outgoing operations or complete books.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, operationId, coverage]
              properties:
                accountId: { type: string, format: uuid }
                operationId: { type: string, format: uuid }
                coverage:
                  allOf:
                    - $ref: '#/components/schemas/ReadingCoverage'
                    - type: object
                      properties:
                        ranges: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/CoverageRange' } }
      responses:
        '200':
          description: Original operation receipt; not necessarily the current paragraph snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, coverage]
                properties:
                  accountId: { type: string, format: uuid }
                  coverage: { $ref: '#/components/schemas/ReadingCoverage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: account_changed, operation_reused or coverage_fragment_limit; no partial mutation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }

components:
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    RateLimit:
      description: Rate limited; wait for Retry-After seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Request error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ChallengeAction:
      type: object
      required: [accountId, kind]
      properties:
        accountId: { type: string, format: uuid }
        kind: { type: string, enum: [preview, join, invite, revoke, leave] }
        challengeId: { type: string, format: uuid, description: Required for invite, revoke and leave. }
        code: { type: string, pattern: '^[a-f0-9]{48}$', description: Required for preview and join. }
        nickname: { type: string, minLength: 1, maxLength: 40, description: Required for join. }
        minutes: { type: integer, enum: [5, 10, 20, 30, 60], description: Required for join. Competitive mode always uses the common target. }
    ChallengeMember:
      type: object
      required: [nickname, minutes, left, self, completedDays, todayComplete]
      properties:
        self: { type: boolean }
        todayComplete: { type: boolean }
        rank: { type: integer, minimum: 1, description: "Competition place by completed days (1, 1, 3); omitted before start and for personal challenges. Includes saved results of departed members; late reports can update places." }
        completedDays: { type: integer, minimum: 0, maximum: 30 }
        nickname: { type: string }
        minutes: { type: integer, enum: [5, 10, 20, 30, 60] }
        left: { type: boolean }
    Challenge:
      type: object
      required: [id, name, mode, startDay, duration, timeZone, minutes, nickname, isOwner, left, members, progress]
      properties:
        progress: { $ref: '#/components/schemas/ChallengeProgress' }
        isOwner: { type: boolean }
        left: { type: boolean }
        members: { type: array, items: { $ref: '#/components/schemas/ChallengeMember' } }
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        mode: { type: string, enum: [competitive, personal] }
        startDay: { type: string, format: date }
        duration: { type: integer, enum: [7, 14, 30] }
        timeZone: { type: string, minLength: 1, maxLength: 100 }
        minutes: { type: integer, enum: [5, 10, 20, 30, 60] }
        nickname: { type: string, maxLength: 40, description: Empty for nonmember previews. }
    ChallengeProgress:
      type: object
      required: [today, endDay, status, days]
      properties:
        today: { type: string, description: Current calendar day in the challenge time zone; empty in nonmember previews. }
        endDay: { type: string }
        status: { type: string, enum: ['', upcoming, active, ended] }
        days:
          type: array
          maxItems: 30
          description: Only the requesting member's accepted totals. Source session dates are retained without time zone conversion. Frozen on departure; active members can receive late reports.
          items:
            type: object
            required: [day, milliseconds, complete]
            properties:
              day: { type: string, format: date }
              milliseconds: { type: integer, minimum: 0 }
              complete: { type: boolean }
    CreateChallenge:
      type: object
      required: [accountId, operationId, name, mode, startDay, duration, timeZone, minutes, nickname]
      properties:
        accountId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        mode: { type: string, enum: [competitive, personal] }
        startDay: { type: string, format: date }
        duration: { type: integer, enum: [7, 14, 30] }
        timeZone: { type: string, minLength: 1, maxLength: 100 }
        minutes: { type: integer, enum: [5, 10, 20, 30, 60] }
        nickname: { type: string, minLength: 1, maxLength: 40 }
    DailyGoalTarget:
