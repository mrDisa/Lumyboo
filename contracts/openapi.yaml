openapi: 3.0.3
info:
  title: Lumyboo API
  version: 0.1.0
  description: Local pilot with email-code authentication and server sessions. Synchronization and rewards are not implemented.
servers:
  - url: /api/v1
paths:
  /catalog:
    get:
      operationId: listBooks
      description: Development fixtures only; not an approved public editorial catalog.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: genre
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Book list
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Book' } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
  /auth/code:
    post:
      operationId: requestLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Code accepted for delivery; no account-existence information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/verify:
    post:
      operationId: verifyLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              additionalProperties: false
              properties:
                challengeId: { type: string, minLength: 43, maxLength: 43 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: A new HttpOnly session cookie is set; raw session tokens are never in JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getAccountSession
      responses:
        '200':
          description: Current account only. Always Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Current session revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/logout-all:
    post:
      operationId: logoutAll
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: All sessions of the current user revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /shelf/:
    get:
      operationId: getAccountShelf
      description: Current account only; never cached. Guest reading data stays separate.
      responses:
        '200':
          description: Account shelf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountShelf' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /shelf/import:
    post:
      operationId: importGuestShelf
      description: Explicit additive copy. Existing account books are preserved; retries cannot create duplicates. Does not consume the guest outbox or transfer progress/bookmarks.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, bookIds]
              additionalProperties: false
              properties:
                accountId: { type: string, format: uuid, description: Expected account; must match the authenticated session. }
                bookIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '200':
          description: Merged account shelf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountShelf' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /bookmarks/:
    get:
      operationId: getAccountBookmarks
      description: Current account only; no guest data or shared caching.
      responses:
        '200':
          description: Active account bookmarks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBookmarks' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /bookmarks/import:
    post:
      operationId: importGuestBookmarks
      description: Additive explicit copy. Existing locators, labels and deletion tombstones win. Entire batch is validated and committed atomically.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, bookmarks]
              properties:
                accountId: { type: string, format: uuid }
                bookmarks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/BookmarkEntry' }
      responses:
        '200':
          description: Active account bookmarks after merge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBookmarks' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /bookmarks/state:
    get:
      operationId: getAccountBookmarkState
      description: Full account bookmark snapshot including deletion tombstones and per-bookmark revisions. Never cached.
      responses:
        '200':
          description: Current account bookmark state
          content:
            application/json:
              schema:
                type: object
                required: [accountId, bookmarks]
                properties:
                  accountId: { type: string, format: uuid }
                  bookmarks: { type: array, items: { $ref: '#/components/schemas/BookmarkState' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /bookmarks/apply:
    post:
      operationId: applyAccountBookmark
      description: One atomic bookmark mutation with optimistic revision and durable operation receipt. Revision 0 means absent; deletes create tombstones even when absent. Reusing an operation UUID with different payload or operation kind fails. A replay returns its original result, which may be older than current state. Client clocks never set precedence. Only current pilot editions are accepted.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, operationId, expectedRevision, bookmark, deleted]
              properties:
                accountId: { type: string, format: uuid }
                operationId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740990 }
                bookmark: { $ref: '#/components/schemas/BookmarkEntry' }
                deleted: { type: boolean }
      responses:
        '200':
          description: Original committed operation result; refetch state for current data
          content:
            application/json:
              schema:
                type: object
                required: [accountId, bookmark]
                properties:
                  accountId: { type: string, format: uuid }
                  bookmark: { $ref: '#/components/schemas/BookmarkState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /positions/:
    get:
      operationId: getAccountPositions
      responses:
        '200':
          description: Current account reading positions; never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPositions' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /positions/choose:
    post:
      operationId: chooseAccountPosition
      description: Explicit choice against the displayed server revision (0 means absent). Prior server position is archived. Retry exactly the same operation ID and payload after an uncertain response; a stale revision is a conflict, not last-write-wins.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PositionChoice'
                - type: object
                  required: [accountId]
                  properties:
                    accountId: { type: string, format: uuid }
      responses:
        '200':
          description: Confirmed position (an idempotent replay may acknowledge an earlier revision).
          content:
            application/json:
              schema:
                type: object
                required: [accountId, position]
                properties:
                  accountId: { type: string, format: uuid }
                  position: { $ref: '#/components/schemas/AccountPosition' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /reading-sessions/:
    get:
      operationId: listReadingSessions
      description: Live pages of the signed-in owner's cumulative reports from all devices, ordered by reported day descending then session UUID descending. Always no-store. Does not import local time or verify days or rewards. Concurrent new rows ahead of the cursor require a refresh; duration updates never change ordering.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page; empty starts at the newest reported day.
          schema: { type: string, maxLength: 47 }
      responses:
        '200':
          description: One page; empty nextCursor means no further rows at query time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSessionPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reading-sessions/{sessionId}:
    get:
      operationId: getReadingSession
      description: Current cumulative client report for the signed-in owner only. A missing or other owner's session returns 404. Always no-store. Does not verify actual reading, calendar-day credit, coverage or rewards.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current session snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reading-sessions/apply:
    post:
      operationId: applyReadingSession
      description: |
        Accept one cumulative, unverified client report. Requires Origin, session cookie,
        X-CSRF-Token and the expected account ID. Session IDs are scoped to the owner.
        A session's device, book, edition and reported calendar day are immutable.
        Milliseconds are a cumulative integer total, never an increment. Larger reports
        advance the total; equal or delayed smaller reports do not change it or its revision.
        Each operation UUID is bound to the complete payload and the shared operation kind.
        Retry an uncertain operation with the same UUID and payload. A retry returns its
        original receipt, which may be older than the current session; never treat it as
        a fresh server snapshot or acknowledgement of later local reports.
        Day is reported by the client, without verified timezone attribution. This endpoint
        grants no daily-goal credit, completion, coverage, XP, streak or race result.
        The browser sends new timer reports explicitly from the account profile,
        in bounded batches with exact persisted operation payloads for retries.
        Old local sessions without edition/device metadata stay local and must not
        be guessed into this protocol.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, operationId, session]
              properties:
                accountId: { type: string, format: uuid }
                operationId: { type: string, format: uuid }
                session: { $ref: '#/components/schemas/ReadingSessionReport' }
      responses:
        '200':
          description: Original operation receipt; not necessarily the current session snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountReadingSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: account_changed, operation_reused or reading_session_conflict. Do not silently retry with changed identity or a new UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }

components:
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    RateLimit:
      description: Rate limited; wait for Retry-After seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Request error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ReadingSessionReport:
      type: object
      additionalProperties: false
      required: [sessionId, deviceId, bookId, version, day, milliseconds]
      properties:
        sessionId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        bookId: { type: string }
        version: { type: string }
        day: { type: string, format: date, description: Unverified client calendar day from 0001-01-01 through 9999-12-31. }
        milliseconds: { type: integer, minimum: 1, maximum: 86400000 }
    ReadingSessionSnapshot:
      type: object
      additionalProperties: false
      required: [sessionId, deviceId, bookId, version, day, milliseconds, revision]
      properties:
        sessionId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        bookId: { type: string }
        version: { type: string }
        day: { type: string, format: date, description: Unverified client calendar day from 0001-01-01 through 9999-12-31. }
        milliseconds: { type: integer, minimum: 1, maximum: 86400000 }
        revision: { type: integer, minimum: 1, maximum: 86400000 }
    AccountReadingSessionPage:
      type: object
      required: [accountId, items, nextCursor]
      properties:
        accountId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ReadingSessionSnapshot' }
        nextCursor: { type: string, maxLength: 47 }
    AccountReadingSession:
      type: object
      required: [accountId, session]
      properties:
        accountId: { type: string, format: uuid }
        session: { $ref: '#/components/schemas/ReadingSessionSnapshot' }
    ReadingLocator:
      type: object
      required: [bookId, version, chapter, paragraph, offset]
      properties:
        bookId: { type: string }
        version: { type: string }
        chapter: { type: integer, minimum: 0 }
        paragraph: { type: string }
        offset: { type: number, minimum: 0, maximum: 1, exclusiveMaximum: true }
    AccountPosition:
      allOf:
        - $ref: '#/components/schemas/ReadingLocator'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
    AccountPositions:
      type: object
      required: [accountId, positions]
      properties:
        accountId: { type: string, format: uuid }
        positions: { type: array, items: { $ref: '#/components/schemas/AccountPosition' } }
    PositionChoice:
      type: object
      required: [operationId, expectedRevision, position]
      properties:
        operationId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740990 }
        position: { $ref: '#/components/schemas/ReadingLocator' }
    BookmarkEntry:
      type: object
      additionalProperties: false
      required: [bookId, version, chapter, paragraph, offset, label]
      properties:
        bookId: { type: string }
        version: { type: string }
        chapter: { type: integer, minimum: 0 }
        paragraph: { type: string }
        offset: { type: number, minimum: 0, maximum: 1, exclusiveMaximum: true }
        label: { type: string, maxLength: 200 }
    BookmarkState:
      type: object
      required: [bookId, version, chapter, paragraph, offset, label, revision, deleted]
      properties:
        bookId: { type: string }
        version: { type: string }
        chapter: { type: integer, minimum: 0 }
        paragraph: { type: string }
        offset: { type: number, minimum: 0, maximum: 1, exclusiveMaximum: true }
        label: { type: string, maxLength: 200 }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        deleted: { type: boolean }
    AccountBookmarks:
      type: object
      required: [accountId, bookmarks]
      properties:
        accountId: { type: string, format: uuid }
        bookmarks: { type: array, items: { $ref: '#/components/schemas/BookmarkEntry' } }
    AccountShelf:
      type: object
      required: [accountId, bookIds]
      properties:
        accountId: { type: string, format: uuid }
        bookIds: { type: array, items: { type: string } }
    LoginChallenge:
      type: object
      required: [challengeId, expiresIn, resendAfter, delivery]
      properties:
        challengeId: { type: string }
        expiresIn: { type: integer }
        resendAfter: { type: integer }
        delivery: { type: string, enum: [email, test] }
    AccountSession:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
        csrfToken: { type: string }
    Book:
      type: object
      required: [id, title, author, genre, year, kind, version, url, sha256, bytes, rights, description, cover]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        genre: { type: string }
        year: { type: string }
        kind: { type: string, enum: [fixture, excerpt] }
        version: { type: string }
        url: { type: string }
        sha256: { type: string }
        bytes: { type: integer }
        rights: { type: string }
        description: { type: string }
        cover: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
