name: checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node scripts/check-content.mjs
      - run: npm run generate:api
      - run: git diff --exit-code -- apps/web/src/lib/api.generated.ts
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/api/go.mod, cache-dependency-path: services/api/go.sum }
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/worker
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_USER: lumyboo, POSTGRES_PASSWORD: test, POSTGRES_DB: lumyboo }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lumyboo" --health-interval 5s --health-timeout 3s --health-retries 10
    env: { PGPASSWORD: test }
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U lumyboo -d lumyboo -v ON_ERROR_STOP=1 -f services/api/db/migrations/001_local_pilot.up.sql
      - run: psql -h localhost -U lumyboo -d lumyboo -v ON_ERROR_STOP=1 -f services/api/db/migrations/001_local_pilot.down.sql
      - run: psql -h localhost -U lumyboo -d lumyboo -v ON_ERROR_STOP=1 -f services/api/db/migrations/001_local_pilot.up.sql
