name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "content/batches/**"
      - "scripts/import_batch.py"
      - "scripts/import_epub.py"
      - "content/rights-registry.json"
      - "scripts/check-pages.mjs"
      - "scripts/check-pwa.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build:pages -w apps/web
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist-pages }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
