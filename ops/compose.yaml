services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lumyboo
      POSTGRES_USER: lumyboo
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumyboo -d lumyboo"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: 100
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lumyboo-local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage:/data"]
volumes:
  postgres:
  storage:
